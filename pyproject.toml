[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-risktest"
version = "0.1.0"
description = "Risk-aware test selection, prioritisation and flakiness triage for pytest."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CS5351 Software Engineering Team" }]
keywords = ["pytest", "regression-testing", "test-selection", "test-prioritisation", "flaky-tests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
risktest = "pytest_risktest.cli:main"

[project.entry-points.pytest11]
risktest = "pytest_risktest.plugin"

[project.urls]
Documentation = "https://github.com/example/pytest-risktest"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:pytest_risktest.*"]

