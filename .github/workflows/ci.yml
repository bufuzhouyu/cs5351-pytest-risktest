name: CI

on:
  push:
    branches: ["main", "master", "sprint/**"]
  pull_request:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8"
      - name: Show interpreter
        run: python -c "import sys, pytest; print(sys.version); print('pytest', pytest.__version__)"
      - name: Unit tests
        run: python -m pytest tests -q --no-header --ignore=tests/test_plugin_integration.py --ignore=tests/test_cli.py
      - name: End-to-end tests (plugin driven through subprocesses)
        run: python -m pytest tests/test_plugin_integration.py tests/test_cli.py -q --no-header

  benchmark-smoke:
    name: benchmark smoke test
    runs-on: ubuntu-latest
    needs: test
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8"
      - name: Generate subjects
        run: python benchmark/generate_subjects.py --subjects 1 --features 8
      - name: One verified mutation, all policies
        run: python benchmark/run_bench.py --subjects 1 --mutations 1 --targets subject_01
      - name: Fail if a failure was hidden by the selection
        run: python -c "import json;d=json.load(open('benchmark/results/benchmark.json'));assert all(r['misses']==0 for r in d['rows']), 'selection hid a failure'"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/

